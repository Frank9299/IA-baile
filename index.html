<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Host</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .status {
      margin: 20px 0;
      font-size: 14px;
      color: #ffca28;
      min-height: 40px;
    }
    #talkBtn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background-color: #e53935;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
    }
    #talkBtn:active {
      background-color: #43a047;
      transform: scale(0.95);
    }
    #talkBtn:disabled {
      background-color: #555555;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Walkie-Talkie (A)</h2>
    <p class="status" id="status">Iniciando...</p>
    <button id="talkBtn" disabled>CONECTANDO...</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    const MI_ID_FIJO = "tu-canal-exclusivo-host-123";
    let peer = null;
    let localStream = null;
    let activeCall = null;

    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        localStream = stream;
        localStream.getAudioTracks()[0].enabled = false;
        iniciarHost();
      })
      .catch(() => { statusEl.innerText = 'Permite el acceso al micrófono.'; });

    function iniciarHost() {
      statusEl.innerText = 'Esperando al otro teléfono...';
      peer = new Peer(MI_ID_FIJO);

      peer.on('open', () => {
        statusEl.innerText = 'Listo. Esperando conexión...';
      });

      peer.on('call', (call) => {
        if (activeCall) activeCall.close();
        activeCall = call;
        call.answer(localStream);

        call.on('stream', (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          activarBoton();
        });

        call.on('close', () => {
          statusEl.innerText = 'Desconectado. Esperando reconexión...';
          talkBtn.disabled = true;
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          statusEl.innerText = 'ID ocupado. Reintentando en 3s...';
          setTimeout(() => { peer.destroy(); iniciarHost(); }, 3000);
        }
      });
    }

    function activarBoton() {
      statusEl.innerText = 'Conectado. Mantén para hablar.';
      talkBtn.innerText = 'MANTÉN PARA HABLAR';
      talkBtn.disabled = false;
    }

    function transmitir() {
      if (localStream && !talkBtn.disabled) {
        localStream.getAudioTracks()[0].enabled = true;
        statusEl.innerText = 'Transmitiendo voz...';
      }
    }

    function detener() {
      if (localStream) {
        localStream.getAudioTracks()[0].enabled = false;
        statusEl.innerText = 'En escucha...';
      }
    }

    talkBtn.addEventListener('mousedown', transmitir);
    talkBtn.addEventListener('mouseup', detener);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); transmitir(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); detener(); });
  </script>
</body>
</html>
