<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Reconexión Automática</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .status {
      margin: 20px 0;
      font-size: 15px;
      color: #ffca28;
    }
    #talkBtn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background-color: #e53935;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
      transition: transform 0.1s, background-color 0.2s;
    }
    #talkBtn:active {
      background-color: #43a047;
      transform: scale(0.95);
    }
    #talkBtn:disabled {
      background-color: #555555;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Walkie-Talkie</h2>
    <p class="status" id="status">Iniciando...</p>
    <button id="talkBtn" disabled>CONECTANDO...</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    // DEFINE AQUÍ TU ROL: En un teléfono pon "telefono-1" y en el otro "telefono-2"
    // (O usa dos enlaces diferentes en GitHub si prefieres tener una app para cada uno)
    const MI_ID = "walkie-dispositivo-A-12345";
    const OTRO_ID = "walkie-dispositivo-B-12345";

    let peer = null;
    let localStream = null;
    let activeCall = null;
    let wakeLock = null;

    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    async function solicitarWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        localStream = stream;
        localStream.getAudioTracks()[0].enabled = false;
        solicitarWakeLock();
        iniciarPeer();
      })
      .catch((err) => {
        statusEl.innerText = 'Error: Permite el acceso al micrófono.';
      });

    function iniciarPeer() {
      statusEl.innerText = 'Conectando al sistema...';
      
      // Creamos el peer con un ID fijo propio
      peer = new Peer(MI_ID);

      peer.on('open', () => {
        statusEl.innerText = 'Listo. Esperando o conectando...';
        intentarConectarConElOtro();
      });

      // Si el servidor rechaza el ID porque otra pestaña vieja sigue abierta, reintentamos en 3 segundos
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          statusEl.innerText = 'Reconectando sesión anterior...';
          setTimeout(() => {
            peer.destroy();
            iniciarPeer();
          }, 3000);
        } else {
          statusEl.innerText = 'Error: ' + err.type;
        }
      });

      // Si el otro dispositivo nos llama
      peer.on('call', (call) => {
        if (activeCall) activeCall.close();
        activeCall = call;
        call.answer(localStream);
        
        call.on('stream', (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          activarBoton();
        });

        call.on('close', () => {
          statusEl.innerText = 'El otro usuario se desconectó. Reintentando...';
          talkBtn.disabled = true;
          intentarConectarConElOtro();
        });
      });
    }

    function intentarConectarConElOtro() {
      // Intentamos llamar al otro dispositivo de forma automática
      const callInterval = setInterval(() => {
        if (activeCall && activeCall.open) {
          clearInterval(callInterval);
          return;
        }

        statusEl.innerText = 'Buscando al otro dispositivo...';
        const call = peer.call(OTRO_ID, localStream);

        if (call) {
          call.on('stream', (remoteStream) => {
            remoteAudio.srcObject = remoteStream;
            activeCall = call;
            clearInterval(callInterval);
            activarBoton();
          });

          call.on('close', () => {
            statusEl.innerText = 'Conexión perdida. Reintentando...';
            talkBtn.disabled = true;
          });
        }
      }, 4000); // Reintenta cada 4 segundos automáticamente si no está conectado
    }

    function activarBoton() {
      statusEl.innerText = 'Conectado. Mantén para hablar.';
      talkBtn.innerText = 'MANTÉN PARA HABLAR';
      talkBtn.disabled = false;
    }

    function transmitir() {
      if (localStream && !talkBtn.disabled) {
        localStream.getAudioTracks()[0].enabled = true;
        statusEl.innerText = 'Transmitiendo voz...';
      }
    }

    function detener() {
      if (localStream) {
        localStream.getAudioTracks()[0].enabled = false;
        statusEl.innerText = 'En escucha...';
      }
    }

    talkBtn.addEventListener('mousedown', transmitir);
    talkBtn.addEventListener('mouseup', detener);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); transmitir(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); detener(); });
  </script>
</body>
</html>
