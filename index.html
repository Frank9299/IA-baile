<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Robot Bailarín con Gemini AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        #ui {
            text-align: center;
            margin-bottom: 20px;
            z-index: 10;
        }

        button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #e94560;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover { background-color: #d83a53; }

        .status { margin-top: 15px; font-size: 18px; color: #4ecca3; }
        .genre-display { font-size: 24px; font-weight: bold; color: #f9a826; margin-top: 10px; }

        /* El Escenario y el Muñeco */
        #stage {
            position: relative;
            width: 300px;
            height: 400px;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #dancer {
            font-size: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Transición suave para el rebote en tiempo real de los bajos */
            transition: transform 0.05s ease-out; 
            transform-origin: bottom center;
        }

        /* Estilos de Baile (CSS Animations aplicadas por la IA) */
        
        /* TECHNO: Saltos rápidos y agresivos */
        .dance-techno {
            animation: technoDance 0.4s infinite alternate ease-in-out;
        }
        @keyframes technoDance {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-40px) scaleY(1.1); filter: drop-shadow(0 0 20px #0ff); }
        }

        /* CUMBIA: Movimiento de lado a lado cadencioso */
        .dance-cumbia {
            animation: cumbiaDance 1s infinite alternate ease-in-out;
        }
        @keyframes cumbiaDance {
            0% { transform: translateX(-30px) rotate(-10deg); }
            100% { transform: translateX(30px) rotate(10deg); }
        }

        /* MERENGUE: Giros rápidos de cadera */
        .dance-merengue {
            animation: merengueDance 0.3s infinite alternate linear;
        }
        @keyframes merengueDance {
            0% { transform: rotateY(0deg) translateX(-10px); }
            100% { transform: rotateY(180deg) translateX(10px); }
        }

        /* REGGAETON: El dembow (rebote profundo abajo) */
        .dance-reggaeton {
            animation: reggaetonDance 0.8s infinite alternate cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        @keyframes reggaetonDance {
            0% { transform: translateY(0) scaleY(1); }
            50% { transform: translateY(30px) scaleY(0.85); }
            100% { transform: translateY(0) scaleY(1); }
        }
    </style>
</head>
<body>

    <div id="ui">
        <h2>🕺 AI Music Dancer</h2>
        <button id="startBtn">Activar Micrófono e IA</button>
        <div id="ai-status" class="status">Esperando...</div>
        <div id="current-genre" class="genre-display">Género: NINGUNO</div>
    </div>

    <div id="stage">
        <div id="dancer">🤖</div>
    </div>

    <script>
        // TU API KEY DE GEMINI (CUIDADO: Es visible. Regenerar después de usar)
        const GEMINI_API_KEY = "AQ.Ab8RN6KNIa1OmnCAUp-LlXOUHfIWhLuacpMK7kXzccoDCt77_Q";
        
        const startBtn = document.getElementById('startBtn');
        const aiStatus = document.getElementById('ai-status');
        const genreDisplay = document.getElementById('current-genre');
        const dancer = document.getElementById('dancer');

        let audioContext;
        let analyser;
        let mediaRecorder;
        let audioChunks = [];
        let isRecording = false;

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            aiStatus.innerText = "Solicitando permisos de micrófono...";

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                // 1. Configurar Web Audio API para el rebote en tiempo real (Los bajos)
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                const source = audioContext.createMediaStreamSource(stream);
                analyser = audioContext.createAnalyser();
                analyser.fftSize = 256;
                source.connect(analyser);
                animarReboteEnTiempoReal();

                // 2. Configurar grabadora para enviar a la IA de Gemini
                // Usamos webm que es nativo en navegadores y soportado por Gemini
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                
                mediaRecorder.ondataavailable = event => {
                    if (event.data.size > 0) audioChunks.push(event.data);
                };

                mediaRecorder.onstop = async () => {
                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    audioChunks = [];
                    await clasificarMusicaConGemini(audioBlob);
                    
                    // Repetir el ciclo: grabar otros 4 segundos
                    grabarFragmento();
                };

                aiStatus.innerText = "¡Escuchando! Pon música fuerte.";
                grabarFragmento(); // Iniciar el primer ciclo de IA

            } catch (err) {
                aiStatus.innerText = "Error: No se pudo acceder al micrófono.";
                console.error(err);
            }
        });

        // Graba 4 segundos de audio y se detiene para enviarlos a procesar
        function grabarFragmento() {
            if (mediaRecorder.state === 'inactive') {
                mediaRecorder.start();
                aiStatus.innerText = "🔴 IA escuchando ritmo (4 seg)...";
                setTimeout(() => {
                    mediaRecorder.stop();
                    aiStatus.innerText = "🧠 Gemini procesando...";
                }, 4000);
            }
        }

        // Convierte el Blob a Base64 para la API de Gemini
        function blobToBase64(blob) {
            return new Promise((resolve, _) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }

        // Llamada directa a la API REST de Gemini 1.5 Flash
        async function clasificarMusicaConGemini(audioBlob) {
            try {
                const base64Audio = await blobToBase64(audioBlob);

                const promptText = "Eres un experto musical. Escucha este fragmento de audio. Clasifica el género musical. Responde ÚNICAMENTE con UNA de estas 4 palabras: TECHNO, CUMBIA, MERENGUE, REGGAETON. Si no escuchas música clara, responde NADA. No digas nada más, solo la palabra.";

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: promptText },
                                {
                                    inlineData: {
                                        mimeType: "audio/webm",
                                        data: base64Audio
                                    }
                                }
                            ]
                        }]
                    })
                });

                const data = await response.json();
                
                if (data.candidates && data.candidates[0].content.parts[0].text) {
                    let genero = data.candidates[0].content.parts[0].text.trim().toUpperCase();
                    
                    // Limpiar signos de puntuación por si acaso
                    genero = genero.replace(/[^A-Z]/g, ''); 

                    console.log("Gemini detectó:", genero);
                    actualizarBaile(genero);
                } else {
                    console.log("No se detectó respuesta válida de la IA.");
                }

            } catch (error) {
                console.error("Error al contactar con Gemini:", error);
                aiStatus.innerText = "Error de conexión con la IA.";
            }
        }

        // Cambia la clase CSS del muñeco dependiendo de la respuesta de la IA
        function actualizarBaile(genero) {
            dancer.className = ''; // Quitar bailes anteriores

            if (genero.includes("TECHNO")) {
                dancer.classList.add("dance-techno");
                genreDisplay.innerText = "Género: 🪩 TECHNO";
            } else if (genero.includes("CUMBIA")) {
                dancer.classList.add("dance-cumbia");
                genreDisplay.innerText = "Género: 🎺 CUMBIA";
            } else if (genero.includes("MERENGUE")) {
                dancer.classList.add("dance-merengue");
                genreDisplay.innerText = "Género: 🥁 MERENGUE";
            } else if (genero.includes("REGGAETON")) {
                dancer.classList.add("dance-reggaeton");
                genreDisplay.innerText = "Género: 🔥 REGGAETÓN";
            } else {
                genreDisplay.innerText = "Género: Buscando ritmo...";
            }
        }

        // Efecto en tiempo real: Hace que el muñeco "vibre" o rebote con el volumen/los bajos
        function animarReboteEnTiempoReal() {
            requestAnimationFrame(animarReboteEnTiempoReal);
            if (!analyser) return;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            // Calcular un promedio de las frecuencias bajas (los golpes / el bombo)
            let sumaBajos = 0;
            for (let i = 0; i < 10; i++) { // Tomamos las primeras frecuencias
                sumaBajos += dataArray[i];
            }
            const promedioBajos = sumaBajos / 10;

            // Si hay un golpe de bajo fuerte, escalamos ligeramente el muñeco
            // Esto se combina con la animación CSS para que parezca que baila AL RITMO exacto
            const escala = 1 + (promedioBajos / 1000); 
            
            // Aplicar la escala sin sobrescribir la transformación de CSS animations (usando custom properties o margin visual, aquí ajustamos scale directamente en el style inline)
            dancer.style.transform = `scale(${escala})`;
        }
    </script>
</body>
</html>
