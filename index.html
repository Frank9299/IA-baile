<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Conexión Estable</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .status {
      margin: 20px 0;
      font-size: 14px;
      color: #ffca28;
      min-height: 40px;
    }
    #talkBtn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background-color: #e53935;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
      transition: transform 0.1s, background-color 0.2s;
    }
    #talkBtn:active {
      background-color: #43a047;
      transform: scale(0.95);
    }
    #talkBtn:disabled {
      background-color: #555555;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Walkie-Talkie</h2>
    <p class="status" id="status">Iniciando micrófono...</p>
    <button id="talkBtn" disabled>CONECTANDO...</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    // ID fijo de la sala compartida para ambos teléfonos
    const SALA_ID = "walkie-talkie-canal-global-98765";
    
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let wakeLock = null;

    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    async function solicitarWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {}
    }

    // 1. Obtener acceso al micrófono
    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        localStream = stream;
        localStream.getAudioTracks()[0].enabled = false;
        solicitarWakeLock();
        inicializarSistema();
      })
      .catch((err) => {
        statusEl.innerText = 'Error: Permite el acceso al micrófono.';
      });

    function inicializarSistema() {
      statusEl.innerText = 'Conectando al servidor...';

      // Intentamos crear el Peer usando el ID de la sala principal
      peer = new Peer(SALA_ID);

      // Si se abre con éxito, significa que SOMOS EL PRIMERO en entrar. 
      // Nos quedamos esperando a que el otro teléfono se conecte.
      peer.on('open', () => {
        statusEl.innerText = 'Esperando al otro dispositivo...';
      });

      // Si alguien nos llama (entra el segundo teléfono), respondemos la llamada
      peer.on('call', (call) => {
        if (activeCall) activeCall.close();
        activeCall = call;
        call.answer(localStream);
        
        call.on('stream', (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          activarBoton();
        });

        call.on('close', () => {
          statusEl.innerText = 'El otro usuario se desconectó. Esperando reconexión...';
          talkBtn.disabled = true;
        });
      });

      // Si da error "unavailable-id", significa que la sala YA ESTÁ OCUPADA 
      // por el primer teléfono. Por lo tanto, SOMOS EL SEGUNDO teléfono.
      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          statusEl.innerText = 'Sala ocupada. Conectando como cliente...';
          conectarComoCliente();
        } else {
          statusEl.innerText = 'Error: ' + err.type;
        }
      });
    }

    function conectarComoCliente() {
      // Creamos un Peer con ID aleatorio propio
      peer = new Peer();

      peer.on('open', (id) => {
        statusEl.innerText = 'Buscando al otro teléfono...';
        llamarAlServidorDeSala();
      });

      peer.on('error', () => {
        setTimeout(conectarComoCliente, 3000);
      });
    }

    function llamarAlServidorDeSala() {
      // Llamamos directamente al ID principal de la sala donde está el primer teléfono
      const call = peer.call(SALA_ID, localStream);

      if (call) {
        call.on('stream', (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          activeCall = call;
          activarBoton();
        });

        call.on('close', () => {
          statusEl.innerText = 'Conexión perdida. Reintentando...';
          talkBtn.disabled = true;
          setTimeout(llamarAlServidorDeSala, 3000); // Reintenta llamar si se desconecta
        });
      } else {
        // Si falla, reintentar en 3 segundos sin mostrar errores molestos en pantalla
        setTimeout(llamarAlServidorDeSala, 3000);
      }
    }

    function activarBoton() {
      statusEl.innerText = 'Conectado. Mantén para hablar.';
      talkBtn.innerText = 'MANTÉN PARA HABLAR';
      talkBtn.disabled = false;
    }

    function transmitir() {
      if (localStream && !talkBtn.disabled) {
        localStream.getAudioTracks()[0].enabled = true;
        statusEl.innerText = 'Transmitiendo voz...';
      }
    }

    function detener() {
      if (localStream) {
        localStream.getAudioTracks()[0].enabled = false;
        statusEl.innerText = 'En escucha...';
      }
    }

    talkBtn.addEventListener('mousedown', transmitir);
    talkBtn.addEventListener('mouseup', detener);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); transmitir(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); detener(); });
  </script>
</body>
</html>
