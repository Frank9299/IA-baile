<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Walkie-Talkie Automático</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background-color: #121212;
      color: #ffffff;
    }
    .container {
      background: #1e1e1e;
      padding: 30px;
      border-radius: 20px;
      text-align: center;
      width: 85%;
      max-width: 320px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }
    .status {
      margin: 20px 0;
      font-size: 15px;
      color: #ffca28;
    }
    #talkBtn {
      width: 170px;
      height: 170px;
      border-radius: 50%;
      border: none;
      background-color: #e53935;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      box-shadow: 0 6px 15px rgba(229, 57, 53, 0.4);
      transition: transform 0.1s, background-color 0.2s;
    }
    #talkBtn:active {
      background-color: #43a047;
      transform: scale(0.95);
    }
    #talkBtn:disabled {
      background-color: #555555;
      box-shadow: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Walkie-Talkie</h2>
    <p class="status" id="status">Iniciando conexión...</p>
    <button id="talkBtn" disabled>CONECTANDO...</button>
  </div>

  <audio id="remoteAudio" autoplay></audio>

  <script>
    const SALA_ID = "mi-canal-walkietalkie-privado-12345";
    
    let peer = null;
    let localStream = null;
    let activeCall = null;
    let wakeLock = null;

    const statusEl = document.getElementById('status');
    const talkBtn = document.getElementById('talkBtn');
    const remoteAudio = document.getElementById('remoteAudio');

    // Evitar que la pantalla se apague mientras se usa la app
    async function solicitarWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
        }
      } catch (err) {
        console.log('Wake Lock no activado:', err.message);
      }
    }

    navigator.mediaDevices.getUserMedia({ audio: true, video: false })
      .then((stream) => {
        localStream = stream;
        localStream.getAudioTracks()[0].enabled = false;
        solicitarWakeLock();
        iniciarConexion();
      })
      .catch((err) => {
        statusEl.innerText = 'Error: Permite el acceso al micrófono.';
      });

    function iniciarConexion() {
      peer = new Peer(SALA_ID);

      peer.on('open', () => {
        statusEl.innerText = 'Esperando al otro teléfono...';
      });

      peer.on('call', (call) => {
        activeCall = call;
        call.answer(localStream);

        call.on('stream', (remoteStream) => {
          remoteAudio.srcObject = remoteStream;
          activarBoton();
        });
      });

      peer.on('error', (err) => {
        if (err.type === 'unavailable-id') {
          peer = new Peer();

          peer.on('open', () => {
            statusEl.innerText = 'Conectando con el otro dispositivo...';
            activeCall = peer.call(SALA_ID, localStream);

            activeCall.on('stream', (remoteStream) => {
              remoteAudio.srcObject = remoteStream;
              activarBoton();
            });
          });
        } else {
          statusEl.innerText = 'Error de conexión: ' + err.type;
        }
      });
    }

    function activarBoton() {
      statusEl.innerText = 'Conectado. Mantén para hablar.';
      talkBtn.innerText = 'MANTÉN PARA HABLAR';
      talkBtn.disabled = false;
    }

    function transmitir() {
      if (localStream && !talkBtn.disabled) {
        localStream.getAudioTracks()[0].enabled = true;
        statusEl.innerText = 'Transmitiendo voz...';
      }
    }

    function detener() {
      if (localStream) {
        localStream.getAudioTracks()[0].enabled = false;
        statusEl.innerText = 'En escucha...';
      }
    }

    talkBtn.addEventListener('mousedown', transmitir);
    talkBtn.addEventListener('mouseup', detener);
    talkBtn.addEventListener('touchstart', (e) => { e.preventDefault(); transmitir(); });
    talkBtn.addEventListener('touchend', (e) => { e.preventDefault(); detener(); });

    // Reactivar el bloqueo de pantalla si el usuario minimiza y regresa a la app
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible') {
        await solicitarWakeLock();
      }
    });
  </script>
</body>
</html>
